<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <!-- Harz-Farbverlauf passend zu deiner lila Akzentfarbe -->
    <linearGradient id="resinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="50%" stop-color="#663399" />
      <stop offset="100%" stop-color="#3b0764" />
    </linearGradient>

    <!-- Glanzlicht-Verlauf -->
    <linearGradient id="highlightGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.1" />
    </linearGradient>
  </defs>

  <!-- Epoxidharz-Tropfen Grundform -->
  <path d="M 32 4 C 32 4 11 27 11 41 A 21 21 0 0 0 53 41 C 53 27 32 4 32 4 Z" 
        fill="url(#resinGrad)" />

  <!-- Harz-Glanzkante oben links -->
  <path d="M 32 8 C 30 11 18 27 17 38 C 16 33 21 22 32 8 Z" 
        fill="url(#highlightGrad)" />

  <!-- Rechner-Symbol im Tropfen -->
  <g fill="#ffffff" opacity="0.95">
    <!-- Rechner-Display -->
    <rect x="25" y="32" width="14" height="3" rx="1" fill="#4ade80" />

    <!-- Tastenfeld -->
    <circle cx="27" cy="40" r="1.5" />
    <circle cx="32" cy="40" r="1.5" />
    <circle cx="37" cy="40" r="1.5" />

    <circle cx="27" cy="46" r="1.5" />
    <circle cx="32" cy="46" r="1.5" />
    <circle cx="37" cy="46" r="1.5" />
  </g>
</svg>
